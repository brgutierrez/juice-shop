# Despliegue de Juice Shop en Kubernetes (manifiesto del Security Team).
# El quality gate BLOQUEANTE del job 4 comprueba sobre este fichero, entre otros:
#   CKV_K8S_16 sin privileged · CKV_K8S_20 sin allowPrivilegeEscalation
#   CKV_K8S_23 sin root · CKV_K8S_28/37 capacidades eliminadas · CKV_K8S_17/19 sin hostPID/hostNetwork
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: juice-shop
  labels:
    app: juice-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      automountServiceAccountToken: false     # la app no habla con la API de Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532                      # el mismo usuario sin privilegios del Dockerfile
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: juice-shop
          # Etiqueta fija (nunca :latest). En producción, mejor por digest (@sha256:...).
          image: ghcr.io/OWNER/REPO:TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            # Juice Shop escribe en data/ y logs/; con sistema de ficheros de solo
            # lectura no arranca. Riesgo aceptado y documentado (CKV_K8S_22).
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
